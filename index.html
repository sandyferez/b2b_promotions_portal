.input { width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 13px; font-family: inherit; color: #334155; transition: border-color .15s; }

/* ── Panel (accordion) ── */
.panel { border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 8px; background: #fff; overflow: hidden; transition: border-color .2s, box-shadow .2s; }

.panel-title { font-size: 13.5px; font-weight: 700; color: #1e293b; margin-left: 10px; flex: 1; }
.panel-summary { font-size: 11.5px; color: #94a3b8; margin-left: 8px; font-weight: 500; max-width: 200px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.field-label { font-size: 10.5px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }

.badge-green { background: #d1fae5; color: #065f46; }

.badge-red { background: #fee2e2; color: #991b1b; }

.kpi-row { display: flex; gap: 12px; margin: 12px 0; }

.kpi-lbl { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }

/* ── State pills ── */

.sp-draft { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }
.sp-pending { background: #fffbeb; color: #92400e; border: 1px solid #fcd34d; }
.sp-scheduled { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.sp-live { background: #f0fdf4; color: #059669; border: 1px solid #bbf7d0; }
.sp-paused { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.sp-ended { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

/* ── Progress bar ── */
.progress-bar { display: flex; gap: 4px; }
.progress-step { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all .15s; }
.progress-step.done { background: #2563eb; color: #fff; }
.progress-step.current { background: #2563eb; color: #fff; }

/* ── Summary panel ── */
.summary-panel { background: #f8faff; border: 1.5px solid #dbeafe; border-radius: 12px; padding: 16px; }
.summary-panel-title { font-size: 13px; font-weight: 800; color: #0f172a; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
.summary-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
.summary-label { font-weight: 700; color: #0f172a; }
.summary-value { color: #64748b; text-align: right; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Reach card ── */
.reach-card { border: 2px solid #86efac; border-radius: 16px; padding: 24px 20px; background: linear-gradient(180deg, #f0fdf4 0%, #fff 100%); text-align: center; transition: all .3s; }
.reach-card.warning { border-color: #fbbf24; background: linear-gradient(180deg, #fffbeb 0%, #fff 100%); }

/* ── Attention card ── */
.attn-card { border-left: 4px solid #dc2626; padding: 16px 20px; margin-bottom: 10px; background: #fef2f2; border-radius: 0 12px 12px 0; display: flex; justify-content: space-between; align-items: center; transition: all .15s; }
.attn-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.attn-card.amber { border-left-color: #f59e0b; background: #fffbeb; }

/* ── Tab bar ── */
.tab-bar { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
.tab-item { padding: 10px 20px; font-size: 13px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; display: flex; align-items: center; gap: 6px; }
.tab-item:hover { color: #334155; }
.tab-item.active { color: #0f172a; border-bottom-color: #2563eb; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 200; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.2); animation: fadeIn .3s ease-out; }
.toast-undo { color: #93c5fd; cursor: pointer; font-weight: 700; text-decoration: underline; }

/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 300; display: flex; align-items: center; justify-content: center; animation: fadeIn .2s; }
.modal-box { background: #fff; border-radius: 16px; padding: 28px; max-width: 520px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,.15); }
.modal-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
.modal-text { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }

/* ── Preview bar ── */
.preview-bar { background: #0f172a; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; color: #fff; }

/* ── Info box ── */
.info-box { border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }

.sv-triage-card.info { background: #eff6ff; border-left: 4px solid #3b82f6; }

.sv-heatcell { display: inline-block; width: 36px; height: 20px; border-radius: 4px; }

.fc-dial { width: 120px; height: 120px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; margin: 0 auto; }

.sv-search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 8px 14px; max-width: 320px; transition: border-color .15s; }

/* ── Filter chips row ── */
.sv-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

/* ═══════════════════════════════════════════
   SHARED COMPONENTS
   ═══════════════════════════════════════════ */
function Toggle({ enabled, onChange, danger }) {
  return (
    <div className="toggle-wrap" onClick={() => onChange(!enabled)}>
      <div className={`toggle-track${enabled ? " on" : ""}${danger ? " danger" : ""}`}><div className="toggle-knob"/></div>
    </div>
  );
}
function Chip({ label, active, onClick }) {
  return <span className={`chip${active ? " active" : ""}`} onClick={onClick}>{label}</span>;
}
function Toast({ message, undo, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
  return <div className="toast"><span>{message}</span>{undo && <span className="toast-undo" onClick={undo}>Undo</span>}</div>;
}
function ModalDialog({ title, text, children, onClose }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        {text && <div className="modal-text">{text}</div>}
        {children}
      </div>
    </div>
  );
}
function InfoBox({ type, icon, children }) {
  return <div className={`info-box ${type}`}><span style={{ fontSize:18, flexShrink:0 }}>{icon}</span><div style={{ flex:1 }}>{children}</div></div>;
}

  ]);

  const [endedPromos, setEndedPromos] = useState([

  ]);

  const [auditLog, setAuditLog] = useState([

  ]);

  const addToAudit = (entry) => setAuditLog(l => [{ ...entry, time: "Just now" }, ...l]);

  const handleSubmitPromo = (promo) => {
    const newPending = {
      id: Date.now(),
      name: promo.headline || `${GOALS.find(g=>g.id===promo.goal)?.name} — ${promo.brand || promo.category || "New Promotion"}`,

      mechanic: promo.mechanic,
      budget: parseInt(promo.budget) || 0,
      submitter: "Sarah Jones",
      submitterRole: "Algo1 Sales Team",
      submittedAgo: "Just now",
      priority: parseInt(promo.budget) > 4000 ? "high" : "normal",
      startDate: promo.startDate,
      endDate: promo.endDate,
      brand: promo.brand || "",
      audience: [promo.category, promo.brand, promo.frequency !== "any" ? promo.frequency : ""].filter(Boolean).join(", ") || "All eligible shoppers",
      stores: promo.storeScope === "all" ? `All stores (${STORES.length})` : `${promo.selectedStores?.length || 0} stores`,
      headline: promo.headline,
      description: promo.description,
    };

    setActiveModule("approval");
  };

  /* Approve */
  const approvePromo = (p) => {
    setPendingQueue(q => q.filter(x => x.id !== p.id));

  const rejectPromo = (id, reason, comment) => {
    const p = pendingQueue.find(x => x.id === id);

  };

    setLivePromos(l => l.map(p => p.id === id ? { ...p, daysLeft: p.daysLeft + 7 } : p));
    addToAudit({ user:"Sarah Jones", action:"Extended", detail:`End date extended by 7 days`, color:"#2563eb" });
    setToast("End date extended by 7 days");
  };

  const needsAttention = livePromos.filter(p => {
    if (p.budget > 0 && p.spent / p.budget > 0.75 && p.daysLeft > 2) return true;
    if (p.claims === 0 && p.impressions > 500) return true;
    return false;

  return (
    <div>

              {k === "scale" && <span className="nav-badge" style={{ background:"#dbeafe", color:"#1e40af" }}>1.2k</span>}
              {k === "forecast" && <span className="nav-badge" style={{ background:"#c4b5fd", color:"#4338ca" }}>🔮</span>}

          <div className="g-nav-avatar">SJ</div>
        </div>
      </div>

      {/* ── MODULES ── */}
      {activeModule === "configure" && <ConfigureModule onComplete={() => { setToast("Setup complete"); setActiveModule("builder"); }} />}
      {activeModule === "builder" && <BuilderModule onSubmit={handleSubmitPromo} />}
      {activeModule === "approval" && <ApprovalModule queue={pendingQueue} auditLog={auditLog} onApprove={approvePromo} onReject={rejectPromo} toast={toast} setToast={setToast} />}
      {activeModule === "performance" && <PerformanceModule live={livePromos} ended={endedPromos} needsAttention={needsAttention} onPause={pausePromo} onEnd={(id) => setModal({type:"end",id})} onIncreaseBudget={increaseBudget} onExtend={extendPromo} onClone={() => setActiveModule("builder")} onNavigate={setActiveModule} toast={toast} setToast={setToast} />}
      {activeModule === "cv1" && <Cv1Module />}
      {activeModule === "scale" && <ScaleModule />}
      {activeModule === "forecast" && <ForecastModule />}

            <button className="btn btn-secondary btn-sm" onClick={() => setModal(null)}>Cancel</button>

          </div>
        </ModalDialog>
      )}
      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

                <div key={key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 16px", marginBottom:8, background: approval[key] ? "#f0fdf4" : "#f8fafc", border: `1.5px solid ${approval[key] ? "#bbf7d0" : "#e2e8f0"}`, borderRadius:10 }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:700, color: approval[key] ? "#065f46" : "#475569" }}>{name}</div>
                    <div style={{ fontSize:11.5, color: approval[key] ? "#065f46" : "#94a3b8", marginTop:2 }}>{approval[key] ? "Requires retailer approval before going live" : "Self-publish — no approval required"}</div>
                  </div>
                  <Toggle enabled={approval[key]} onChange={v => setApproval({...approval,[key]:v})} />
                </div>
              ))}
              <InfoBox type="blue" icon="ℹ️"><div style={{ fontSize:12, color:"#1e40af" }}>Changes apply to new submissions only. Existing promotions in the queue keep their current approval state.</div></InfoBox>
            </div>}
            {step===5 && <div className="card" style={{ padding:24 }}>
              <h3 style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>Integration Readiness</h3>
              <p style={{ fontSize:13, color:"#64748b", marginBottom:16 }}>Confirms both engineering integrations are operational before enabling the platform.</p>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                <div style={{ background:"#f0fdf4", border:"1.5px solid #bbf7d0", borderRadius:12, padding:20 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:"#065f46", marginBottom:8 }}>ALGO1 Payload Delivery</div>
                  <span className="badge badge-green" style={{ marginBottom:10, display:"inline-flex" }}>Operational</span>
                  <p style={{ fontSize:12, color:"#64748b", lineHeight:1.5 }}>Sends promotion data to ALGO1 when a promotion enters the pool. Data structure and API interface agreed with engineering.</p>
                </div>
                <div style={{ background: intRedemption ? "#f0fdf4" : "#fffbeb", border:`1.5px solid ${intRedemption ? "#bbf7d0" : "#fcd34d"}`, borderRadius:12, padding:20 }}>
                  <div style={{ fontSize:14, fontWeight:700, color: intRedemption ? "#065f46" : "#92400e", marginBottom:8 }}>Redemption Event Receiver</div>
                  <span className={`badge ${intRedemption ? "badge-green" : "badge-amber"}`} style={{ marginBottom:10, display:"inline-flex" }}>{intRedemption ? "Operational" : "Pending"}</span>
                  <p style={{ fontSize:12, color:"#64748b", lineHeight:1.5 }}>Receives redemption events from the B2C app. Three options: EPOS integration (target), App QR (fallback), Loyalty auto-credit (long-term).</p>
                  {!intRedemption && <button className="btn btn-sm btn-warning" style={{ marginTop:10 }} onClick={() => setIntRedemption(true)}>Simulate Connection</button>}
                </div>
              </div>
              {!intRedemption && <InfoBox type="amber" icon="⚠️"><div style={{ fontSize:12, fontWeight:700, color:"#92400e" }}>Open dependency — OD-01: Redemption mechanism</div><div style={{ fontSize:12, color:"#92400e", marginTop:2 }}>Without confirmed redemption data, performance metrics are estimated. Does not block start of build.</div></InfoBox>}
            </div>}
          </div>
          <div style={{ flex:"1 1 0", minWidth:260 }}>
            <div className="summary-panel" style={{ position:"sticky", top:72 }}>
              <div className="summary-panel-title">Setup Progress</div>
              {[["Retailer",step>1?retailer.name:"—"],["Stores",step>2?`${selStores.length} registered`:"—"],["Users",step>3?`${users.filter(u=>u.name).length} assigned`:"—"],["Approval",step>4?"Rules active":"—"],["Integration",step>5?"Connected":"—"]].map(([k,v]) => <div key={k} className="summary-row"><span className="summary-label">{k}</span><span className="summary-value">{v}</span></div>)}
            </div>
          </div>
        </div>
      </div></div>
      <div style={{ background:"#fff", borderTop:"1.5px solid #e2e8f0", padding:"0 32px" }}><div style={{ maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:64 }}>
        <button className="btn btn-secondary" disabled={step===1} onClick={() => setStep(step-1)}>← Back</button>
        <button className="btn btn-primary" onClick={() => setStep(step+1)}>{step===5 ? "Complete Setup ✓" : "Continue →"}</button>
      </div></div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   MODULE 2: PROMOTION BUILDER
   ═══════════════════════════════════════════ */
function BuilderModule({ onSubmit }) {
  const [step, setStep] = useState(1);
  const [p, setP] = useState({
    goal:"", mechanic:"", headline:"", description:"", hasImage:false,
    category:"", brand:"", frequency:"any", gender:[], ageRanges:[], loyaltyTiers:[], pointsMin:"", pointsMax:"",
    segments:[], excludeBuyers:false, excludeSeen:false,
    budget:"3000", maxRedemptions:"1", startDate:"2026-04-01", endDate:"2026-04-14", storeScope:"all", selectedStores: STORES.map(s=>s.id),
  });
  const [mechConfirmed, setMechConfirmed] = useState(false);
  const [openPanels, setOpenPanels] = useState({ demographics:false, loyalty:false, shopping:true, segments:false, exclusions:true });
  const togglePanel = k => setOpenPanels(o => ({...o, [k]:!o[k]}));
  const labels = ["Goal","Mechanic","Creative","Audience","Budget & Timing"];
  const goalObj = GOALS.find(g => g.id === p.goal);
  const mechObj = MECHANICS.find(m => m.id === p.mechanic);
  const set = (k,v) => setP(prev => ({...prev, [k]:v}));
  const toggleArr = (k,v) => setP(prev => ({...prev, [k]: prev[k].includes(v) ? prev[k].filter(x=>x!==v) : [...prev[k],v] }));

  const reach = useMemo(() => {
    let b = TOTAL_SHOPPERS;
    if (p.gender.length > 0 && p.gender.length < 2) b = Math.round(b * .54);
    if (p.ageRanges.length > 0 && p.ageRanges.length < 6) b = Math.round(b * p.ageRanges.length * .155);
    if (p.loyaltyTiers.length > 0) b = Math.round(b * p.loyaltyTiers.length * .22);
    if (p.category) b = Math.round(b * .28);
    if (p.brand) b = Math.round(b * .45);
    if (p.frequency && p.frequency !== "any") b = Math.round(b * .4);
    if (p.excludeBuyers) b = Math.round(b * .62);
    if (p.excludeSeen) b = Math.round(b * .78);
    return Math.max(b, 0);
  }, [p]);
  const reachPct = Math.round(reach / TOTAL_SHOPPERS * 100);

  const canProceed = () => {
    if (step===1) return !!p.goal;
    if (step===2) return !!p.mechanic && mechConfirmed;
    if (step===3) return !!p.headline;
    if (step===5) return !!p.budget && !!p.startDate && !!p.endDate;
    return true;
  };

  const audienceSummary = [p.category, p.brand, p.frequency!=="any" ? p.frequency : "", p.excludeBuyers ? "Excl: existing buyers" : "", p.excludeSeen ? "Excl: seen" : ""].filter(Boolean).join(" · ") || "All eligible shoppers";

  return (
    <div className="page-shell">
      <div className="page-header"><div className="page-header-inner" style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}><div><div className="page-title">Promotion Builder</div><div className="page-desc">Create, target, and submit promotions to ALGO1</div></div></div></div>
      <div style={{ background:"#fff", borderBottom:"1.5px solid #e2e8f0", padding:"12px 32px" }}><div style={{ maxWidth:1200, margin:"0 auto" }}><div className="progress-bar" style={{ marginBottom:0 }}>
        {labels.map((l,i) => <div key={i} className={`progress-step ${i+1<step?"done":i+1===step?"current":"upcoming"}`} onClick={() => {if(i+1<step)setStep(i+1)}}>{i+1<step?"✓ ":""}{i+1}. {l}</div>)}
      </div></div></div>
      <div className="page-content"><div className="page-content-inner">
        <div style={{ display:"flex", gap:20 }}>
          <div style={{ flex:"2 1 0", minWidth:0 }} className="fade-in" key={step}>

            {/* STEP 1: GOAL */}
            {step===1 && <>
              <h3 style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>What is the promotion objective?</h3>
              <p style={{ fontSize:13, color:"#64748b", marginBottom:16 }}>One goal per promotion. The selected goal determines the primary metric shown in Campaign Performance.</p>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
                {GOALS.map(g => <div key={g.id} className={`card${p.goal===g.id?" card-selected":""}`} style={{ padding:20, cursor:"pointer" }} onClick={() => set("goal",g.id)}>
                  <div style={{ fontSize:28, marginBottom:8 }}>{g.icon}</div>
                  <div style={{ fontSize:15, fontWeight:700, color: p.goal===g.id ? "#1e40af" : "#0f172a", marginBottom:4 }}>{g.name}</div>
                  <div style={{ fontSize:12, color:"#64748b", lineHeight:1.5 }}>{g.desc}</div>
                  <div style={{ fontSize:11, color:"#94a3b8", marginTop:8, fontWeight:500 }}>Primary metric: {g.metric}</div>
                </div>)}
              </div>
            </>}

            {/* STEP 2: MECHANIC */}
            {step===2 && <>
              <h3 style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>What does the shopper receive?</h3>
              <p style={{ fontSize:13, color:"#64748b", marginBottom:16 }}>One mechanic per promotion. The most common mechanic for your goal is highlighted.</p>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
                {MECHANICS.map(m => {
                  const isMostUsed = m.mostUsedFor.includes(p.goal);
                  return <div key={m.id} className={`card${p.mechanic===m.id?" card-selected":""}`} style={{ padding:20, cursor:"pointer", position:"relative" }} onClick={() => { set("mechanic",m.id); setMechConfirmed(false); }}>
                    {isMostUsed && <span className="badge badge-blue" style={{ position:"absolute", top:12, right:12 }}>Most used</span>}
                    <div style={{ fontSize:15, fontWeight:700, color: p.mechanic===m.id ? "#1e40af" : "#0f172a", marginBottom:4 }}>{m.name}</div>
                    <div style={{ fontSize:12, color:"#64748b" }}>{m.desc}</div>
                  </div>;
                })}
              </div>
              {p.mechanic && !mechConfirmed && <div style={{ background:"#f0fdf4", border:"1.5px solid #bbf7d0", borderRadius:12, padding:16, marginBottom:12 }}>
                <div style={{ fontSize:13, fontWeight:700, color:"#065f46", marginBottom:6 }}>Confirm what the shopper sees</div>
                <div style={{ fontSize:14, color:"#334155", fontWeight:600 }}>"{mechObj?.name} — Heinz Baked Beans 415g"</div>
                <div style={{ marginTop:12, display:"flex", gap:8 }}>
                  <button className="btn btn-success btn-sm" onClick={() => setMechConfirmed(true)}>Confirm ✓</button>
                  <button className="btn-ghost" onClick={() => set("mechanic","")}>Change</button>
                </div>
              </div>}
              {mechConfirmed && <InfoBox type="green" icon="✓"><div style={{ fontSize:13, color:"#065f46", fontWeight:600 }}>Confirmed: {mechObj?.name}</div></InfoBox>}
              {p.mechanic === "bonus_pts" && p.goal !== "loyalty" && <InfoBox type="amber" icon="⚠️"><div style={{ fontSize:12, fontWeight:700, color:"#92400e" }}>Compatibility note</div><div style={{ fontSize:12, color:"#92400e", marginTop:2 }}>Bonus loyalty points paired with {goalObj?.name} is an unusual combination. Consider % Off for faster results. This is a signal, not a block.</div></InfoBox>}
            </>}

            {/* STEP 3: CREATIVE */}
            {step===3 && <>
              <h3 style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>What does the shopper see?</h3>
              <p style={{ fontSize:13, color:"#64748b", marginBottom:16 }}>Content shown on the trolley-mounted device. The offer badge is generated from your mechanic.</p>
              <div style={{ display:"flex", gap:20, marginBottom:20 }}>
                <div style={{ flex:1 }}><div className="field-group"><div className="field-label">Product image</div>
                  <div style={{ border:`2px dashed ${p.hasImage?"#86efac":"#dbeafe"}`, borderRadius:12, padding:32, textAlign:"center", cursor:"pointer", background: p.hasImage ? "#f0fdf4" : "#f8fafc", transition:"all .15s" }} onClick={() => set("hasImage",!p.hasImage)}>
                    {p.hasImage ? <><div style={{ fontSize:28 }}>📷</div><div style={{ fontSize:13, fontWeight:600, color:"#059669", marginTop:4 }}>Image uploaded</div><div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>Click to remove</div></> : <><div style={{ fontSize:28, opacity:.5 }}>🖼️</div><div style={{ fontSize:13, color:"#94a3b8", marginTop:4 }}>Drop image here or click to upload</div><div style={{ fontSize:11, color:"#cbd5e1", marginTop:2 }}>PNG, JPG. Product image or brand asset.</div></>}
                  </div>
                </div></div>
                <div style={{ flex:1 }}>
                  <div className="field-group"><div className="field-label">Headline</div><input className="input" placeholder="e.g. Try Heinz Baked Beans" value={p.headline} onChange={e => set("headline",e.target.value)} /></div>
                  <div className="field-group"><div className="field-label">Short description</div><input className="input" placeholder="e.g. 20% off your first purchase this week" value={p.description} onChange={e => set("description",e.target.value)} /></div>
                </div>
              </div>
              {(p.headline || p.description) && <>
                <div className="field-label" style={{ marginBottom:8 }}>Live Preview — Trolley Screen</div>
                <div className="preview-bar">
                  <div style={{ width:60, height:60, background:"#1e3a5f", borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><span style={{ fontSize:p.hasImage?24:11, color:p.hasImage?"#fff":"#64748b" }}>{p.hasImage ? "📷" : "Image"}</span></div>
                  <div>
                    {mechObj && <span style={{ background:"#2563eb", padding:"3px 12px", borderRadius:6, fontSize:12, fontWeight:700, display:"inline-block", marginBottom:6 }}>{mechObj.name.toUpperCase()}</span>}
                    {p.headline && <div style={{ fontSize:16, fontWeight:700 }}>{p.headline}</div>}
                    {p.description && <div style={{ fontSize:12, color:"#94a3b8", marginTop:3 }}>{p.description}</div>}
                  </div>
                </div>
                <div style={{ fontSize:11, color:"#94a3b8", fontStyle:"italic", marginTop:6 }}>Offer badge auto-generated from mechanic. Preview updates as you type.</div>
              </>}
            </>}

            {/* STEP 4: AUDIENCE */}
            {step===4 && <>
              <h3 style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>Who should see this promotion?</h3>
              <p style={{ fontSize:13, color:"#64748b", marginBottom:12 }}>Define targeting rules. ALGO1 matches shoppers in real time. Default: all eligible shoppers. Narrow from here.</p>
              <InfoBox type="amber" icon="⚡"><div style={{ fontSize:12, fontWeight:700, color:"#92400e" }}>Trial 1 — Simplified targeting</div><div style={{ fontSize:12, color:"#a16207", marginTop:2 }}>Shopping History and Exclusions are the primary dimensions. Demographics and Loyalty are available where retailer data exists.</div></InfoBox>

              {/* 1. Demographics */}
              <div className={`panel${openPanels.demographics?" open":""}`}>
                <div className="panel-header" onClick={() => togglePanel("demographics")}><div style={{ display:"flex", alignItems:"center" }}><div className="panel-num">1</div><span className="panel-title">Demographics</span></div><div style={{ display:"flex", alignItems:"center" }}><span className="panel-summary">{p.gender.length || p.ageRanges.length ? `${[...p.gender,...p.ageRanges].join(", ")}` : "No filter"}</span><span className="panel-arrow">▸</span></div></div>
                {openPanels.demographics && <div className="panel-content slide-down">
                  <div className="field-group"><div className="field-label">Gender</div><div style={{ display:"flex", gap:6 }}>{["Male","Female"].map(g => <Chip key={g} label={g} active={p.gender.includes(g)} onClick={() => toggleArr("gender",g)} />)}</div></div>
                  <div className="field-group"><div className="field-label">Age range</div><div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{AGE_RANGES.map(a => <Chip key={a} label={a} active={p.ageRanges.includes(a)} onClick={() => toggleArr("ageRanges",a)} />)}</div></div>
                </div>}
              </div>

              {/* 2. Loyalty */}
              <div className={`panel${openPanels.loyalty?" open":""}`}>
                <div className="panel-header" onClick={() => togglePanel("loyalty")}><div style={{ display:"flex", alignItems:"center" }}><div className="panel-num">2</div><span className="panel-title">Loyalty Signals</span></div><div style={{ display:"flex", alignItems:"center" }}><span className="panel-summary">{p.loyaltyTiers.length ? p.loyaltyTiers.join(", ") : "No filter"}</span><span className="panel-arrow">▸</span></div></div>
                {openPanels.loyalty && <div className="panel-content slide-down">
                  <div className="field-group"><div className="field-label">Loyalty tier</div><div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{LOYALTY_TIERS.map(t => <Chip key={t} label={t} active={p.loyaltyTiers.includes(t)} onClick={() => toggleArr("loyaltyTiers",t)} />)}</div></div>
                  <div className="field-group"><div className="field-label">Points balance</div><div style={{ display:"flex", gap:8 }}><input type="number" className="input" placeholder="Min" value={p.pointsMin} onChange={e => set("pointsMin",e.target.value)} /><input type="number" className="input" placeholder="Max" value={p.pointsMax} onChange={e => set("pointsMax",e.target.value)} /></div></div>
                </div>}
              </div>

              {/* 3. Shopping History (renamed from Behaviour Signals) */}
              <div className={`panel${openPanels.shopping?" open":""}`}>
                <div className="panel-header" onClick={() => togglePanel("shopping")}><div style={{ display:"flex", alignItems:"center" }}><div className="panel-num">3</div><span className="panel-title">Shopping History</span></div><div style={{ display:"flex", alignItems:"center" }}><span className="panel-summary">{p.category || p.frequency!=="any" ? [p.category,p.brand,p.frequency!=="any"?p.frequency:""].filter(Boolean).join(" · ") : "No filter"}</span><span className="panel-arrow">▸</span></div></div>
                {openPanels.shopping && <div className="panel-content slide-down">
                  <div className="field-group"><div className="field-label">Buys this category</div><select className="sel" value={p.category} onChange={e => { set("category",e.target.value); set("brand",""); }}><option value="">All categories</option>{CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                  <div className="field-group"><div className="field-label">Buys this brand</div><select className="sel" value={p.brand} onChange={e => set("brand",e.target.value)} disabled={!p.category}><option value="">{p.category ? "All brands in "+p.category : "Select a category first"}</option>{p.category && (BRANDS_MAP[p.category]||[]).map(b => <option key={b} value={b}>{b}</option>)}</select></div>
                  <div className="field-group"><div className="field-label">Shopping frequency</div><div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{[["any","Any frequency"],["weekly","Weekly+"],["fortnightly","Fortnightly"],["monthly","Monthly"],["less","< Monthly"]].map(([v,l]) => <Chip key={v} label={l} active={p.frequency===v} onClick={() => set("frequency",v)} />)}</div></div>
                </div>}
              </div>

              {/* 4. Interest Segments (hidden at T1) */}
              <div className="panel" style={{ opacity:.5 }}>
                <div className="panel-header" style={{ cursor:"default" }}><div style={{ display:"flex", alignItems:"center" }}><div className="panel-num" style={{ background:"#94a3b8" }}>4</div><span className="panel-title" style={{ color:"#94a3b8" }}>Interest Segments</span></div><span className="badge badge-purple" style={{ fontSize:10 }}>Commercial v1</span></div>
              </div>

              {/* 5. Exclusions */}
              <div className={`panel excl${openPanels.exclusions?" open":""}`}>
                <div className="panel-header" onClick={() => togglePanel("exclusions")}><div style={{ display:"flex", alignItems:"center" }}><div className="panel-num red">5</div><span className="panel-title">Exclusions</span></div><div style={{ display:"flex", alignItems:"center" }}><span className="panel-summary">{p.excludeBuyers || p.excludeSeen ? [p.excludeBuyers&&"Existing buyers",p.excludeSeen&&"Seen this week"].filter(Boolean).join(", ") : "None"}</span><span className="panel-arrow">▸</span></div></div>
                {openPanels.exclusions && <div className="panel-content slide-down">
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderBottom:"1px solid #f1f5f9" }}><div><div style={{ fontSize:13, fontWeight:600, color:"#334155" }}>Exclude existing buyers of this brand</div><div style={{ fontSize:11, color:"#94a3b8" }}>Removes shoppers who bought this brand in the last 90 days</div></div><Toggle enabled={p.excludeBuyers} onChange={v => set("excludeBuyers",v)} danger /></div>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0" }}><div><div style={{ fontSize:13, fontWeight:600, color:"#334155" }}>Exclude shoppers who saw this promotion</div><div style={{ fontSize:11, color:"#94a3b8" }}>Prevents the same shopper seeing this promotion twice in 7 days</div></div><Toggle enabled={p.excludeSeen} onChange={v => set("excludeSeen",v)} danger /></div>
                </div>}
              </div>

              {/* Audience summary */}
              <div style={{ border:"1.5px solid #bfdbfe", borderRadius:12, padding:"12px 16px", background:"#eff6ff", marginTop:8 }}>
                <div style={{ fontSize:10.5, fontWeight:700, color:"#2563eb", textTransform:"uppercase", letterSpacing:".05em", marginBottom:6 }}>Audience summary</div>
                <div style={{ fontSize:12.5, color:"#334155" }}>{audienceSummary}</div>
              </div>

              {/* Zero-reach warning */}
              {reach === 0 && <InfoBox type="amber" icon="⚠️"><div style={{ fontSize:13, fontWeight:700, color:"#92400e" }}>No shoppers match these criteria</div><div style={{ fontSize:12, color:"#92400e", marginTop:4 }}>Your exclusion rules removed all shoppers from the audience. Remove the "exclude existing buyers" rule, or broaden the age range.</div><div style={{ marginTop:8, display:"flex", gap:8 }}><button className="btn btn-warning btn-sm" onClick={() => { set("excludeBuyers",false); set("excludeSeen",false); }}>Expand Audience</button><button className="btn-ghost" style={{ fontSize:12 }}>Continue Anyway</button></div></InfoBox>}
            </>}

            {/* STEP 5: BUDGET & TIMING + REVIEW */}
            {step===5 && <>
              <h3 style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>Budget, Timing & Store Scope</h3>
              <p style={{ fontSize:13, color:"#64748b", marginBottom:16 }}>Set the budget cap, schedule, and store scope. Then review and submit.</p>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:20 }}>
                <div>
                  <div className="field-group"><div className="field-label">Total budget cap (hard limit)</div><div style={{ position:"relative" }}><span style={{ position:"absolute", left:12, top:10, fontSize:13, color:"#94a3b8", fontWeight:600 }}>£</span><input className="input" type="number" style={{ paddingLeft:24 }} value={p.budget} onChange={e => set("budget",e.target.value)} /></div></div>
                  <div className="field-group"><div className="field-label">Max redemptions per shopper</div><input className="input" type="number" value={p.maxRedemptions} onChange={e => set("maxRedemptions",e.target.value)} /></div>
                  <div className="field-group"><div className="field-label">Start date</div><input className="input" type="date" value={p.startDate} onChange={e => set("startDate",e.target.value)} /></div>
                  <div className="field-group"><div className="field-label">End date</div><input className="input" type="date" value={p.endDate} onChange={e => set("endDate",e.target.value)} /></div>
                </div>
                <div>
                  <div className="field-group"><div className="field-label">Store scope</div>
                    <div style={{ display:"flex", gap:6, marginBottom:12 }}>
                      <Chip label="All stores" active={p.storeScope==="all"} onClick={() => set("storeScope","all")} />
                      <Chip label="Specific stores" active={p.storeScope==="specific"} onClick={() => set("storeScope","specific")} />
                    </div>
                    {p.storeScope === "specific" && <div style={{ maxHeight:200, overflow:"auto" }}>
                      {STORES.map(s => {
                        const ch = p.selectedStores.includes(s.id);
                        return <div key={s.id} className={`store-check${ch?" checked":""}`} onClick={() => set("selectedStores", ch ? p.selectedStores.filter(x=>x!==s.id) : [...p.selectedStores, s.id])}>
                          <div className="store-check-box">{ch && <span style={{ fontSize:11, lineHeight:1 }}>✓</span>}</div>
                          <div><div style={{ fontSize:12, fontWeight:600 }}>{s.name}</div><div style={{ fontSize:10.5, color:"#94a3b8" }}>{s.region}</div></div>
                        </div>;
                      })}
                    </div>}
                  </div>
                  {parseInt(p.budget) > 0 && reach > 0 && (() => { const est = Math.round(reach * .34); return est > parseInt(p.budget); })() && <InfoBox type="amber" icon="⚠️"><div style={{ fontSize:12, fontWeight:700, color:"#92400e" }}>Cost projection warning</div><div style={{ fontSize:12, color:"#92400e", marginTop:2 }}>Estimated cost at full redemption: <strong>£{Math.round(reach*.34).toLocaleString()}</strong>. Exceeds budget cap of £{parseInt(p.budget).toLocaleString()}. The promotion pauses when the cap is reached.</div><div style={{ fontSize:11, color:"#94a3b8", fontStyle:"italic", marginTop:4 }}>Signal, not a block.</div></InfoBox>}
                </div>
              </div>
              {/* REVIEW */}
              <div style={{ borderTop:"2px solid #e2e8f0", paddingTop:20 }}>
                <h3 style={{ fontSize:16, fontWeight:700, marginBottom:12 }}>Review & Submit</h3>
                <div className="card" style={{ padding:20 }}>
                  {[["Goal",goalObj?.name],["Mechanic",mechObj?.name],["Creative",p.headline],["Audience",audienceSummary],["Budget",p.budget?`£${parseInt(p.budget).toLocaleString()}`:null],["Dates",p.startDate&&p.endDate?`${p.startDate} to ${p.endDate}`:null],["Stores",p.storeScope==="all"?`All stores (${STORES.length})`:`${p.selectedStores.length} stores`],["Est. reach",`${reach.toLocaleString()} shoppers`]].map(([k,v]) => <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid #f1f5f9", fontSize:13 }}><span style={{ fontWeight:700, color:"#0f172a" }}>{k}</span><span style={{ color: v ? "#64748b" : "#dc2626" }}>{v || "Missing"}</span></div>)}
                </div>
              </div>
            </>}
          </div>

          {/* RIGHT PANEL */}
          <div style={{ flex:"1 1 0", minWidth:280 }}>
            <div style={{ position:"sticky", top:72 }}>
              <div className="summary-panel" style={{ marginBottom:12 }}>
                <div className="summary-panel-title">Promotion Summary</div>
                {[["Goal",goalObj?.name],["Mechanic",mechObj?.name],["Audience",step>=4?audienceSummary:null],["Budget",p.budget?`£${parseInt(p.budget).toLocaleString()}`:null],["Stores",p.storeScope==="all"?`All (${STORES.length})`:p.selectedStores?.length?`${p.selectedStores.length} stores`:null]].map(([k,v]) => <div key={k} className="summary-row"><span className="summary-label">{k}</span><span className="summary-value">{v || "—"}</span></div>)}
                <div style={{ fontSize:10, color:"#94a3b8", fontStyle:"italic", marginTop:8, borderTop:"1px solid #e2e8f0", paddingTop:8 }}>Sticky panel. Updates in real time.</div>
              </div>
              {step >= 4 && <div className={`reach-card${reach===0?" warning":""}`}>
                <div style={{ fontSize:10.5, fontWeight:700, color: reach>0?"#15803d":"#92400e", textTransform:"uppercase", letterSpacing:".08em", marginBottom:8 }}>Estimated Reach</div>
                <div style={{ fontSize: reach>0?44:18, fontWeight:900, color: reach>0?"#16a34a":"#d97706", lineHeight:1 }}>{reach>0?reach.toLocaleString():"No shoppers match"}</div>
                {reach > 0 && <>
                  <div style={{ fontSize:13, color:"#16a34a", marginTop:6, fontWeight:500 }}>~{reachPct}% of {TOTAL_SHOPPERS.toLocaleString()} weekly shoppers</div>
                  <div style={{ height:8, background:"#e2e8f0", borderRadius:4, overflow:"hidden", marginTop:16 }}>
                    <div style={{ height:"100%", borderRadius:4, width:`${Math.max(reachPct,3)}%`, background: reachPct>50?"linear-gradient(90deg,#059669,#34d399)":reachPct>20?"linear-gradient(90deg,#f59e0b,#fbbf24)":"linear-gradient(90deg,#ef4444,#f87171)", transition:"width .5s ease-out" }} />
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}><span style={{ fontSize:10, color:"#94a3b8" }}>Narrow</span><span style={{ fontSize:10, color:"#94a3b8" }}>Broad</span></div>
                </>}
                <div style={{ fontSize:11, color:"#64748b", marginTop:12, lineHeight:1.4 }}>Updates live as filters change. Debounced 300–500ms.</div>
              </div>}
            </div>
          </div>
        </div>
      </div></div>
      <div style={{ background:"#fff", borderTop:"1.5px solid #e2e8f0", padding:"0 32px" }}><div style={{ maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:64 }}>
        <button className="btn btn-secondary" disabled={step===1} onClick={() => setStep(step-1)}>← Back</button>
        <div style={{ display:"flex", gap:8 }}>
          {step===5 && <button className="btn-ghost" onClick={() => alert("Draft saved")}>Save Draft</button>}
          {step<5 ? <button className="btn btn-primary" disabled={!canProceed()} onClick={() => setStep(step+1)}>Continue →</button>
            : <button className="btn btn-primary" disabled={!canProceed()} onClick={() => onSubmit({...p, reach})}>Submit for Approval →</button>}
        </div>
      </div></div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   MODULE 3: APPROVAL GATEWAY
   ═══════════════════════════════════════════ */
function ApprovalModule({ queue, auditLog, onApprove, onReject, toast, setToast }) {
  const [rejectTarget, setRejectTarget] = useState(null);
  const [rejectReason, setRejectReason] = useState("");
  const [rejectComment, setRejectComment] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [viewTab, setViewTab] = useState("queue");

  const doReject = () => {
    if (!rejectReason) return;
    onReject(rejectTarget, rejectReason, rejectComment);
    setRejectTarget(null); setRejectReason(""); setRejectComment("");
  };

  const priorityBadge = p => {
    if (p==="urgent") return <span className="badge badge-red">Urgent</span>;
    if (p==="high") return <span className="badge badge-amber">High</span>;
    return <span className="badge badge-blue">Normal</span>;
  };

  return (
    <div className="page-shell">
      <div className="page-header"><div className="page-header-inner"><div className="page-title">Approval Gateway</div><div className="page-desc">Retailer control over what runs in their stores</div></div></div>
      <div className="page-content"><div className="page-content-inner">
        {/* State flow */}
        <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:16 }}>
          {[["Draft","sp-draft"],["Pending Approval","sp-pending"],["Scheduled","sp-scheduled"],["Live","sp-live"],["Ended","sp-ended"]].map(([l,c],i) => <React.Fragment key={l}>{i>0&&<span style={{ color:"#93c5fd" }}>→</span>}<span className={`sp ${c}`}>{l}</span></React.Fragment>)}
          <span style={{ marginLeft:12 }}><span className="sp sp-paused">Paused</span><span style={{ fontSize:11, color:"#64748b", marginLeft:4 }}>Branches from Live</span></span>
        </div>
        {/* Who approves what */}
        <InfoBox type="blue" icon="ℹ️"><div style={{ fontSize:12, color:"#1e40af" }}><strong>Who approves what:</strong> Algo1 Sales Team → requires Retailer Trade Team approval. Loyalty Team → requires approval. Retailer Trade Team → self-publish, no approval. Approval rules are configurable in Configure.</div></InfoBox>

        <div className="tab-bar">
          <div className={`tab-item${viewTab==="queue"?" active":""}`} onClick={() => setViewTab("queue")}>Pending Queue <span className="badge badge-amber" style={{ marginLeft:4 }}>{queue.length}</span></div>
          <div className={`tab-item${viewTab==="audit"?" active":""}`} onClick={() => setViewTab("audit")}>Audit Trail</div>
        </div>

        {viewTab === "queue" && <div style={{ display:"flex", gap:24 }}>
          <div style={{ flex:"2 1 0" }}>
            {queue.length === 0 ? <div style={{ textAlign:"center", padding:48 }}><div style={{ fontSize:48, marginBottom:8 }}>✅</div><div style={{ fontSize:16, fontWeight:700, color:"#334155", marginBottom:4 }}>No promotions waiting for approval</div><div style={{ fontSize:13, color:"#94a3b8" }}>Queue is clear.</div></div>
            : <>
              <div style={{ fontSize:11, color:"#94a3b8", marginBottom:12 }}>Sorted: budget (high→low), then urgency, then submission time</div>
              {queue.map(item => (
                <div key={item.id} className="card" style={{ marginBottom:10 }}>
                  <div style={{ padding:16, display:"flex", alignItems:"center", gap:12 }}>
                    {priorityBadge(item.priority)}
                    <div style={{ flex:1, cursor:"pointer" }} onClick={() => setExpandedId(expandedId===item.id?null:item.id)}>
                      <div style={{ fontSize:14, fontWeight:700, color:"#0f172a" }}>{item.name}</div>
                      <div style={{ fontSize:12, color:"#64748b", marginTop:2 }}>{item.submitterRole} · {GOALS.find(g=>g.id===item.goal)?.name} · £{item.budget.toLocaleString()} · Starts {item.startDate}</div>
                    </div>
                    <span style={{ fontSize:11, color:"#94a3b8", whiteSpace:"nowrap" }}>{item.submittedAgo} ago</span>
                    <div style={{ display:"flex", gap:6 }}>
                      <button className="btn btn-success btn-sm" onClick={() => onApprove(item)}>Approve</button>
                      <button className="btn btn-sm" style={{ background:"#fff", color:"#dc2626", border:"1.5px solid #fecaca", borderRadius:8, padding:"7px 16px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }} onClick={() => setRejectTarget(item.id)}>Reject</button>
                    </div>
                  </div>
                  {/* Expanded detail */}
                  {expandedId === item.id && <div className="slide-down" style={{ borderTop:"1px solid #e2e8f0", padding:16 }}>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
                      <div>
                        {[["Goal",GOALS.find(g=>g.id===item.goal)?.name],["Mechanic",MECHANICS.find(m=>m.id===item.mechanic)?.name],["Budget",`£${item.budget.toLocaleString()}`],["Dates",`${item.startDate} – ${item.endDate}`],["Stores",item.stores]].map(([k,v]) => <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:"1px solid #f1f5f9", fontSize:12.5 }}><span style={{ fontWeight:700, color:"#0f172a" }}>{k}</span><span style={{ color:"#64748b" }}>{v}</span></div>)}
                      </div>
                      <div>
                        <div className="field-label">Audience</div>
                        <div style={{ fontSize:12.5, color:"#334155", marginBottom:8 }}>{item.audience}</div>
                        <div className="field-label">Creative</div>
                        {item.headline && <div className="preview-bar" style={{ padding:10, gap:10 }}>
                          <div style={{ width:36, height:36, background:"#1e3a5f", borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><span style={{ fontSize:8, color:"#64748b" }}>📷</span></div>
                          <div><div style={{ fontSize:12, fontWeight:700 }}>{item.headline}</div>{item.description && <div style={{ fontSize:11, color:"#94a3b8" }}>{item.description}</div>}</div>
                        </div>}
                        <div style={{ fontSize:12, color:"#64748b", marginTop:8 }}>Submitted by: <strong style={{ color:"#334155" }}>{item.submitter}</strong></div>
                      </div>
                    </div>
                  </div>}
                </div>
              ))}
            </>}
          </div>
          {/* Sidebar: recent audit */}
          <div style={{ flex:"1 1 0", minWidth:300 }}>
            <div style={{ fontSize:13, fontWeight:700, color:"#0f172a", marginBottom:8 }}>Recent Activity</div>
            <div className="card" style={{ padding:12 }}>
              {auditLog.slice(0,6).map((e,i) => <div key={i} className="audit-row">
                <div className="audit-dot" style={{ background:e.color }} />
                <div style={{ flex:1 }}>
                  <div style={{ display:"flex", justifyContent:"space-between" }}><span style={{ fontWeight:600, color:"#334155", fontSize:12 }}>{e.user}</span><span style={{ fontSize:10.5, color:"#94a3b8" }}>{e.time}</span></div>
                  <div style={{ fontSize:11.5, color:"#64748b", marginTop:2 }}><span className={`badge badge-${e.color==="#059669"?"green":e.color==="#dc2626"?"red":e.color==="#f59e0b"?"amber":"blue"}`} style={{ marginRight:4, fontSize:10 }}>{e.action}</span>{e.detail}</div>
                </div>
              </div>)}
            </div>
          </div>
        </div>}

        {viewTab === "audit" && <div className="card" style={{ padding:20 }}>
          <div style={{ fontSize:14, fontWeight:700, marginBottom:12 }}>Full Audit Trail</div>
          {auditLog.map((e,i) => <div key={i} className="audit-row">
            <div className="audit-dot" style={{ background:e.color }} />
            <div style={{ flex:1 }}>
              <div style={{ display:"flex", justifyContent:"space-between" }}><span style={{ fontWeight:600, color:"#334155" }}>{e.user}</span><span style={{ fontSize:11, color:"#94a3b8" }}>{e.time}</span></div>
              <div style={{ fontSize:12, color:"#64748b", marginTop:2 }}><span className={`badge badge-${e.color==="#059669"?"green":e.color==="#dc2626"?"red":e.color==="#f59e0b"?"amber":"blue"}`} style={{ marginRight:6 }}>{e.action}</span>{e.detail}</div>
            </div>
          </div>)}
        </div>}

      </div></div>
      {/* Reject modal */}
      {rejectTarget && <ModalDialog title="Reject Promotion" text="The promotion returns to Draft. The submitter is notified with your reason." onClose={() => setRejectTarget(null)}>
        <div className="field-group"><div className="field-label">Rejection reason (required)</div><select className="sel" value={rejectReason} onChange={e => setRejectReason(e.target.value)}><option value="">Select a reason...</option>{REJECT_REASONS.map(r => <option key={r} value={r}>{r}</option>)}</select></div>
        <div className="field-group"><div className="field-label">Additional comment (optional)</div><textarea className="input" rows={3} placeholder="Add context for the submitter..." value={rejectComment} onChange={e => setRejectComment(e.target.value)} /></div>
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}><button className="btn btn-secondary btn-sm" onClick={() => setRejectTarget(null)}>Cancel</button><button className="btn btn-danger btn-sm" disabled={!rejectReason} onClick={doReject}>Reject Promotion</button></div>
      </ModalDialog>}
    </div>
  );
}

/* ═══════════════════════════════════════════
   MODULE 4: CAMPAIGN PERFORMANCE
   ═══════════════════════════════════════════ */
function PerformanceModule({ live, ended, needsAttention, onPause, onEnd, onIncreaseBudget, onExtend, onClone, onNavigate, toast, setToast }) {
  const [tab, setTab] = useState("attention");
  const [expanded, setExpanded] = useState(null);

  const triggerInfo = (p) => {
    if (p.budget > 0 && p.spent / p.budget > .75 && p.daysLeft > 2) return { label:"Budget risk", desc:`${Math.round(p.spent/p.budget*100)}% consumed, ${p.daysLeft} days remaining`, color:"red", action:"Increase Budget", actionFn: () => onIncreaseBudget(p.id, 2000) };
    if (p.claims === 0 && p.impressions > 500) return { label:"Zero claims", desc:"No claims after 48 hours live", color:"amber", action:"Edit Promotion", actionFn: () => { setTab("live"); setExpanded(p.id); } };
    return { label:"Review", desc:"Check this promotion", color:"amber", action:"View", actionFn: () => { setTab("live"); setExpanded(p.id); } };
  };

  return (
    <div className="page-shell">
      <div className="page-header"><div className="page-header-inner"><div className="page-title">Campaign Performance</div><div className="page-desc">One view across all promotions — attention management, not reporting</div></div></div>
      <div className="page-content"><div className="page-content-inner">
        {/* KPIs */}
        <div className="kpi-row" style={{ marginBottom:20 }}>
          {[["Live",live.length,"#0f172a"],["Needs Attention",needsAttention.length, needsAttention.length>0?"#dc2626":"#059669"],["Impressions",live.reduce((s,p)=>s+p.impressions,0).toLocaleString(),"#0f172a"],["Claims",live.reduce((s,p)=>s+p.claims,0).toLocaleString(),"#0f172a"],["Ended",ended.length,"#0f172a"]].map(([l,v,c]) => <div key={l} className="kpi"><div className="kpi-val" style={{ color:c }}>{v}</div><div className="kpi-lbl">{l}</div></div>)}
        </div>
        {/* Tabs */}
        <div className="tab-bar">
          <div className={`tab-item${tab==="attention"?" active":""}`} onClick={() => setTab("attention")}>Needs Attention {needsAttention.length>0 && <span className="badge badge-red">{needsAttention.length}</span>}</div>
          <div className={`tab-item${tab==="live"?" active":""}`} onClick={() => setTab("live")}>Live <span className="badge badge-green">{live.length}</span></div>
          <div className={`tab-item${tab==="ended"?" active":""}`} onClick={() => setTab("ended")}>Ended <span className="badge badge-gray">{ended.length}</span></div>
        </div>

        {/* ATTENTION */}
        {tab==="attention" && (needsAttention.length===0 ? <div style={{ textAlign:"center", padding:48 }}><div style={{ fontSize:48, marginBottom:8 }}>✅</div><div style={{ fontSize:16, fontWeight:700, color:"#334155" }}>All promotions running normally</div><div style={{ fontSize:13, color:"#94a3b8", marginTop:4 }}>No promotions need your attention right now.</div></div>
          : needsAttention.map(p => { const t = triggerInfo(p); return (
            <div key={p.id} className={`attn-card${t.color==="amber"?" amber":""} fade-in`}>
              <div style={{ flex:1 }}><div style={{ fontSize:14, fontWeight:700, color:"#0f172a" }}>{p.name}</div><div style={{ fontSize:12, fontWeight:600, color:t.color==="red"?"#dc2626":"#92400e", marginTop:4 }}>{t.label} — {t.desc}</div><div style={{ fontSize:12, color:"#64748b", marginTop:4 }}>{GOALS.find(g=>g.id===p.goal)?.name} · £{p.budget.toLocaleString()} budget · {p.impressions.toLocaleString()} impressions · {p.claims} claims</div></div>
              <button className={`btn btn-sm ${t.color==="red"?"btn-danger":"btn-warning"}`} onClick={t.actionFn}>{t.action}</button>
            </div>);
          })
        )}

        {/* LIVE */}
        {tab==="live" && (live.length===0 ? <div style={{ textAlign:"center", padding:48 }}><div style={{ fontSize:48, marginBottom:8, opacity:.5 }}>📊</div><div style={{ fontSize:16, fontWeight:700, color:"#334155" }}>No live promotions</div><div style={{ fontSize:13, color:"#94a3b8", marginTop:4 }}>Create a promotion to see performance data here.</div><button className="btn btn-primary" style={{ marginTop:16 }} onClick={() => onNavigate("builder")}>Create a Promotion</button></div>
          : live.map(p => (
            <div key={p.id} className="card fade-in" style={{ marginBottom:12 }}>
              <div style={{ padding:16, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }} onClick={() => setExpanded(expanded===p.id?null:p.id)}>
                <div style={{ display:"flex", alignItems:"center", gap:12 }}><span className="sp sp-live">Live</span><div><div style={{ fontSize:14, fontWeight:700, color:"#0f172a" }}>{p.name}</div><div style={{ fontSize:12, color:"#64748b", marginTop:2 }}>{GOALS.find(g=>g.id===p.goal)?.name} · £{p.budget.toLocaleString()} · {p.stores}</div></div></div>
                <span style={{ fontSize:12, color:"#94a3b8" }}>{expanded===p.id?"▾":"▸"}</span>
              </div>
              {expanded===p.id && <div className="slide-down" style={{ borderTop:"1px solid #e2e8f0" }}>
                <div style={{ padding:16 }}>
                  <div className="kpi-row">
                    {[["Impressions",p.impressions.toLocaleString()],["Claims",p.claims.toLocaleString()],["Claim Rate",`${p.claimRate}%`],["Redeemed",p.redeemed.toLocaleString()],["Redemption",`${p.redemptionRate}%`]].map(([l,v]) => <div key={l} className="kpi"><div className="kpi-val">{v}</div><div className="kpi-lbl">{l}</div></div>)}
                  </div>
                  {/* Mini bar chart */}
                  {p.dailyImpressions && p.dailyImpressions.length > 0 && <div style={{ marginTop:12 }}>
                    <div className="field-label">Daily impressions</div>
                    <div className="bar-chart" style={{ height:50 }}>{p.dailyImpressions.map((v,i) => <div key={i} className="bar-chart-bar" style={{ height:`${Math.max(v/Math.max(...p.dailyImpressions)*100,2)}%` }} title={`Day ${i+1}: ${v}`} />)}</div>
                  </div>}
                  {/* Budget bar */}
                  <div style={{ marginTop:16 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, fontWeight:600, color:"#64748b", marginBottom:4 }}><span>Budget: £{p.spent.toLocaleString()} / £{p.budget.toLocaleString()}</span><span style={{ color: p.spent/p.budget>.8?"#dc2626":"#64748b" }}>{Math.round(p.spent/p.budget*100)}% used · {p.daysLeft} days left</span></div>
                    <div style={{ height:8, background:"#e2e8f0", borderRadius:4, overflow:"hidden" }}><div style={{ height:"100%", borderRadius:4, width:`${Math.min(Math.round(p.spent/p.budget*100),100)}%`, background: p.spent/p.budget>.8?"linear-gradient(90deg,#ef4444,#f87171)":"linear-gradient(90deg,#2563eb,#60a5fa)", transition:"width .5s" }} /></div>
                  </div>
                  {/* Info */}
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginTop:12, fontSize:12 }}>
                    <div><span style={{ fontWeight:700, color:"#0f172a" }}>Primary metric:</span> <span style={{ color:"#64748b" }}>{GOALS.find(g=>g.id===p.goal)?.metric}</span></div>
                    <div><span style={{ fontWeight:700, color:"#0f172a" }}>Audience:</span> <span style={{ color:"#64748b" }}>{p.audience}</span></div>
                  </div>
                  {/* Actions */}
                  <div style={{ display:"flex", gap:8, marginTop:16, flexWrap:"wrap" }}>
                    <button className="btn-ghost" onClick={() => onPause(p.id)}>⏸ Pause</button>
                    <button className="btn-ghost" onClick={() => onEnd(p.id)}>End Early</button>
                    <button className="btn-ghost" onClick={() => onIncreaseBudget(p.id, 1000)}>+£1k Budget</button>
                    <button className="btn-ghost" onClick={() => onExtend(p.id)}>+7 Days</button>
                  </div>
                  <div style={{ fontSize:11, color:"#94a3b8", marginTop:8 }}>Pause/Resume/Extend: single-click with 5s undo toast. End Early/Terminate: confirmation modal required.</div>
                </div>
              </div>}
            </div>
          ))
        )}

        {/* ENDED */}
        {tab==="ended" && (ended.length===0 ? <div style={{ textAlign:"center", padding:48 }}><div style={{ fontSize:48, marginBottom:8, opacity:.5 }}>📋</div><div style={{ fontSize:16, fontWeight:700, color:"#334155" }}>No completed promotions yet</div></div>
          : ended.map(p => (
            <div key={p.id} className="card fade-in" style={{ marginBottom:10 }}>
              <div style={{ padding:16, display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer" }} onClick={() => setExpanded(expanded===p.id?null:p.id)}>

/* ═══════════════════════════════════════════
   SCALE DATA GENERATOR
   ═══════════════════════════════════════════ */
function generateScaleData() {
  const brands = ["Cadbury","Heinz","Kellogg's","Coca-Cola","Walkers","Dove","Persil","Müller","Birds Eye","Pedigree","Weetabix","L'Oréal","Mars","Pepsi","Arla","Cathedral City","Warburtons","McCain","Pampers","Ribena","Quaker","Felix","Lucozade","Hovis","Fairy","Dettol","Pringles","Nivea","Aptamil","Yeo Valley"];
  const goals = ["trial","purchase","stock","loyalty"];
  const mechs = ["pct_off","spend_get","bogo","bonus_pts"];
  const statuses = ["draft","pending","scheduled","live","ended"];
  const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
  const pick = arr => arr[rand(0,arr.length-1)];
  const promos = [];
  const now = Date.now();
  for (let i = 0; i < 1247; i++) {
    const status = i < 18 ? "draft" : i < 42 ? "pending" : i < 97 ? "scheduled" : i < 409 ? "live" : "ended";
    const goal = pick(goals);
    const mech = pick(mechs);
    const brand = pick(brands);
    const cat = pick(CATEGORIES);
    const budget = rand(5,80)*100;
    const spent = status==="ended" ? budget*rand(70,100)/100 : status==="live" ? budget*rand(10,95)/100 : 0;
    const impressions = status==="live" ? rand(200,45000) : status==="ended" ? rand(1000,80000) : 0;
    const claims = Math.round(impressions * rand(5,35)/100);
    const redeemed = Math.round(claims * rand(60,95)/100);
    const claimRate = impressions > 0 ? +(claims/impressions*100).toFixed(1) : 0;
    const redemptionRate = claims > 0 ? +(redeemed/claims*100).toFixed(1) : 0;
    const daysLeft = status==="live" ? rand(1,21) : 0;
    const budgetRisk = status==="live" && spent/budget > .75 && daysLeft > 2;
    const zeroClaims = status==="live" && claims === 0 && impressions > 500;
    const lowConversion = status==="live" && claimRate < 5 && impressions > 2000;
    const severity = budgetRisk ? "critical" : zeroClaims ? "critical" : lowConversion ? "warning" : null;
    const goalAchieved = status==="ended" ? Math.random() > .35 : null;
    const roi = status==="ended" && spent > 0 ? +((redeemed*rand(3,12)/spent)*100).toFixed(0)/100 : null;
    const sparkline = [];
    if (status==="live"||status==="ended") { for(let d=0;d<rand(5,14);d++) sparkline.push(rand(20,100)); }
    promos.push({ id:10000+i, name:`${mech==="pct_off"?rand(10,30)+"% off":mech==="bogo"?"BOGO":mech==="spend_get"?"Spend £"+rand(15,30)+" Get £"+rand(2,5):"Bonus Points"} ${brand} ${cat}`, brand, category:cat, goal, mechanic:mech, status, budget, spent:Math.round(spent), impressions, claims, redeemed, claimRate, redemptionRate, daysLeft, severity, goalAchieved, roi, sparkline, stores:rand(1,6)+" stores", submitter:pick(["Sarah Jones","Mike Chen","Tom Williams","Emma Davis","Priya Patel","James Wilson"]), startDate:`${rand(1,28)} ${pick(["Jan","Feb","Mar","Apr"])} 2026`, endDate:`${rand(1,28)} ${pick(["Mar","Apr","May","Jun"])} 2026` });
  }
  return promos;
}
const SCALE_PROMOS = generateScaleData();

            </div>
            {selectedPromo.sparkline.length > 0 && <div style={{ marginBottom:16 }}>
              <div className="field-label">Daily Performance Trend</div>
              <div className="bar-chart" style={{ height:80 }}>{selectedPromo.sparkline.map((v,i) => <div key={i} className="bar-chart-bar" style={{ height:`${v}%`, background: selectedPromo.severity==="critical"?"#ef4444":"#2563eb" }} />)}</div>
            </div>}
            {selectedPromo.budget > 0 && <div style={{ marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, fontWeight:600, color:"#64748b", marginBottom:4 }}><span>Budget utilisation</span><span style={{ color: selectedPromo.spent/selectedPromo.budget>.8?"#dc2626":"#64748b" }}>{Math.round(selectedPromo.spent/selectedPromo.budget*100)}%</span></div>
              <div style={{ height:10, background:"#e2e8f0", borderRadius:5, overflow:"hidden" }}><div style={{ height:"100%", borderRadius:5, width:`${Math.min(Math.round(selectedPromo.spent/selectedPromo.budget*100),100)}%`, background: selectedPromo.spent/selectedPromo.budget>.8?"linear-gradient(90deg,#ef4444,#f87171)":"linear-gradient(90deg,#2563eb,#60a5fa)" }} /></div>
            </div>}
            {selectedPromo.severity && <InfoBox type={selectedPromo.severity==="critical"?"red":"amber"} icon={selectedPromo.severity==="critical"?"🔴":"🟡"}>
              <div style={{ fontSize:12, fontWeight:700, color:selectedPromo.severity==="critical"?"#dc2626":"#92400e" }}>{selectedPromo.severity==="critical"?"Critical alert":"Warning"}</div>
              <div style={{ fontSize:12, color:"#64748b", marginTop:2 }}>
                {selectedPromo.spent/selectedPromo.budget>.75 ? `Budget is ${Math.round(selectedPromo.spent/selectedPromo.budget*100)}% consumed with ${selectedPromo.daysLeft} days remaining. Recommend increasing budget or ending early.` : selectedPromo.claims===0 ? "Zero claims despite impressions. Likely audience mismatch or creative issue." : `Claim rate ${selectedPromo.claimRate}% is below the expected 8-15% range for this goal type.`}
              </div>
            </InfoBox>}
            <div style={{ display:"flex", gap:8, marginTop:16 }}>
              <button className="btn btn-primary btn-sm">Clone & Improve</button>
              <button className="btn-ghost">+£2k Budget</button>
              <button className="btn-ghost">+7 Days</button>
              <button className="btn-ghost">Pause</button>
              <button className="btn-ghost" style={{ color:"#dc2626", borderColor:"#fecaca" }}>End Early</button>
            </div>
          </div>
        </div>}

        {view==="detail" && !selectedPromo && <div style={{ textAlign:"center", padding:48 }}><div style={{ fontSize:16, fontWeight:700 }}>Select a promotion from the table to see details</div><button className="btn btn-primary" style={{ marginTop:12 }} onClick={() => setView("table")}>Go to Table</button></div>}

      </div></div>
    </div>
  );
}

            <div className="card" style={{ padding:24 }}>
              <div style={{ fontSize:12, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:".06em", marginBottom:12 }}>Projected Spend</div>
              <div style={{ textAlign:"center", marginBottom:16 }}><span style={{ fontSize:32, fontWeight:900, color:"#0f172a" }}>£{fc.spend.mid.toLocaleString()}</span><span style={{ fontSize:13, color:"#64748b", marginLeft:4 }}>of £{data.budget.toLocaleString()}</span></div>
              <div style={{ marginBottom:12 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, marginBottom:3 }}><span style={{ color:"#64748b" }}>Projected utilisation</span><span style={{ fontWeight:700, color: fc.spend.mid/data.budget>.9?"#dc2626":"#334155" }}>{Math.round(fc.spend.mid/data.budget*100)}%</span></div>
                <div className="fc-bar" style={{ height:12 }}><div className="fc-bar-fill" style={{ width:`${Math.min(Math.round(fc.spend.mid/data.budget*100),100)}%`, background: fc.spend.mid/data.budget>.9?"linear-gradient(90deg,#ef4444,#f87171)":"linear-gradient(90deg,#2563eb,#60a5fa)" }} /></div>
              </div>
              <div style={{ fontSize:11, color:"#64748b" }}>
                <div>Pacing pattern: <strong style={{ color:"#334155" }}>{fc.pacing}</strong></div>
                <div>Peak expected: <strong style={{ color:"#334155" }}>{fc.peakDay}</strong></div>
              </div>
            </div>
          </div>

          {/* Risk + recommendation */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:20 }}>
            <InfoBox type="amber" icon="⚠️"><div style={{ fontSize:13, fontWeight:700, color:"#92400e" }}>Risk Signal</div><div style={{ fontSize:12, color:"#92400e", marginTop:4, lineHeight:1.6 }}>{fc.risk}</div></InfoBox>
            <InfoBox type="green" icon="💡"><div style={{ fontSize:13, fontWeight:700, color:"#065f46" }}>ALGO1 Recommendation</div><div style={{ fontSize:12, color:"#065f46", marginTop:4, lineHeight:1.6 }}>Increase budget to £{fc.adjustedBudget.toLocaleString()} for optimal goal probability. This is based on {fc.similar.count} similar promotions. {!showAdjusted && <span style={{ cursor:"pointer", textDecoration:"underline", fontWeight:700 }} onClick={() => setShowAdjusted(true)}>Apply adjustments →</span>}</div></InfoBox>
          </div>

          {/* Historical comparison */}
          <div className="card" style={{ padding:20 }}>
            <div style={{ fontSize:14, fontWeight:700, color:"#0f172a", marginBottom:12 }}>Historical Comparison — {fc.similar.count} Similar Promotions</div>
            <div style={{ fontSize:12, color:"#64748b", marginBottom:16 }}>Same goal type ({goalLabel(sp.goal)}) and mechanic, similar audience size and budget range. Historical data from the past 6 months.</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
              {[
                ["Avg Claim Rate",fc.similar.avgClaim+"%","Across "+fc.similar.count+" promotions"],
                ["Avg Redemption",fc.similar.avgRedeem+"%","Claims converted"],
                ["Best Performer",fc.similar.bestRate+"%",fc.similar.bestBrand],
                ["Your Estimate",(fc.redemptions.mid/(fc.audience||1)*100).toFixed(1)+"%","Based on audience of "+fc.audience.toLocaleString()],
              ].map(([l,v,sub]) => (
                <div key={l} style={{ background:"#f8faff", borderRadius:10, padding:14, border:"1px solid #e2e8f0", textAlign:"center" }}>
                  <div style={{ fontSize:20, fontWeight:800, color:"#4338ca" }}>{v}</div>
                  <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:".04em", marginTop:4 }}>{l}</div>
                  <div style={{ fontSize:10, color:"#94a3b8", marginTop:2 }}>{sub}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Approver note */}
          <div style={{ background:"linear-gradient(135deg,#eff6ff,#dbeafe)", border:"1.5px solid #bfdbfe", borderRadius:12, padding:20, marginTop:16, display:"flex", alignItems:"center", gap:16 }}>
            <span style={{ fontSize:28 }}>👁️</span>
            <div><div style={{ fontSize:14, fontWeight:700, color:"#1e40af" }}>Visible to the approver</div><div style={{ fontSize:12.5, color:"#334155", marginTop:4 }}>When this promotion enters the Approval Gateway, the Retailer Trade Team sees this forecast alongside the promotion details. No competitor shows predictions to the approver at point of decision.</div></div>
          </div>
        </>}

      </div></div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════ */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
